<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<defs>
  <linearGradient id="sos-body" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#7b72f2"/><stop offset="1" stop-color="#2a2486"/></linearGradient>
  <radialGradient id="sos-lift" cx="50%" cy="0%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="sos-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>
  <linearGradient id="sos-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
  <linearGradient id="sos-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0.05"/></linearGradient>
  <clipPath id="sos-clip"><circle cx="50" cy="50" r="48"/></clipPath>
  <clipPath id="sos-lens"><circle cx="39" cy="50" r="19"/></clipPath>
  <filter id="sos-soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#120d4a" flood-opacity=".45"/></filter>
</defs>
<circle cx="50" cy="50" r="48" fill="url(#sos-body)"/>
<g clip-path="url(#sos-clip)"><rect width="100" height="100" fill="url(#sos-lift)"/></g>
<g filter="url(#sos-soft)">
  <circle cx="39" cy="50" r="19" fill="url(#sos-fill)" stroke="url(#sos-edge)" stroke-width="2.2"/>
  <circle cx="61" cy="50" r="19" fill="url(#sos-fill)" stroke="url(#sos-edge)" stroke-width="2.2"/>
</g>
<g clip-path="url(#sos-lens)"><circle cx="61" cy="50" r="19" fill="#fff" fill-opacity="0.16"/></g>
<circle cx="50" cy="50" r="47.4" fill="none" stroke="url(#sos-rim)" stroke-width="1"/>
</svg>