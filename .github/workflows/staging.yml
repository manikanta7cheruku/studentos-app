name: Staging

# Every merge to main: apply the database migrations to the STAGING Supabase project, then check that
# the new version is live on the staging site and answers (smoke test). Fake data only.
# Setup steps for the owner: docs/STAGING_SETUP.md. Until the secrets and variables exist, this workflow
# explains what is missing and ends green, so merges are not blocked.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: "Also load the fake seed data. First time only: the seed adds fixed rows. Never use on production."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  migrate:
    name: Apply migrations to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      configured: ${{ steps.config.outputs.configured }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No pnpm cache here: when staging is not configured we skip the install, so there is nothing
          # to cache and the cache step would fail the job at the end.
      - name: Check that staging is configured
        id: config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$STAGING_DB_PASSWORD" ] || [ -z "$STAGING_PROJECT_REF" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging is not set up yet::Add the secrets SUPABASE_ACCESS_TOKEN and STAGING_DB_PASSWORD and the variable STAGING_SUPABASE_PROJECT_REF. See docs/STAGING_SETUP.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - name: Link the staging project
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: pnpm supabase link --project-ref "$STAGING_PROJECT_REF" --password "$STAGING_DB_PASSWORD"
      - name: Build the IPv4 pooler connection string from the database password
        if: steps.config.outputs.configured == 'true'
        env:
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_DB_HOST: ${{ vars.STAGING_DB_HOST }}
        run: |
          # GitHub runners have no IPv6, so we connect through the Supabase session pooler (IPv4).
          # The string is built here, with the password URL-encoded, so nobody has to edit a string by hand.
          url=$(node -e '
            const host = process.env.STAGING_DB_HOST || "aws-0-ap-northeast-1.pooler.supabase.com";
            const user = "postgres." + process.env.STAGING_PROJECT_REF;
            process.stdout.write("postgresql://" + user + ":" + encodeURIComponent(process.env.STAGING_DB_PASSWORD) + "@" + host + ":5432/postgres");
          ')
          echo "::add-mask::$url"
          echo "STAGING_POOLER_URL=$url" >> "$GITHUB_ENV"
          node -e '
            console.log(JSON.stringify({
              host: process.env.STAGING_DB_HOST || "aws-0-ap-northeast-1.pooler.supabase.com",
              password_length: process.env.STAGING_DB_PASSWORD.length,
              password_has_brackets: /[\[\]]/.test(process.env.STAGING_DB_PASSWORD),
              password_has_whitespace: /\s/.test(process.env.STAGING_DB_PASSWORD),
              password_is_the_placeholder: process.env.STAGING_DB_PASSWORD.toUpperCase().includes("YOUR-PASSWORD"),
            }, null, 2));
          '
      - name: Show what will be applied
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          if [ -n "$STAGING_POOLER_URL" ]; then
            pnpm supabase db push --db-url "$STAGING_POOLER_URL" --dry-run
          else
            pnpm supabase db push --linked --password "$STAGING_DB_PASSWORD" --dry-run
          fi
      - name: Apply migrations
        if: steps.config.outputs.configured == 'true' && inputs.seed != true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          if [ -n "$STAGING_POOLER_URL" ]; then
            pnpm supabase db push --db-url "$STAGING_POOLER_URL"
          else
            pnpm supabase db push --linked --password "$STAGING_DB_PASSWORD"
          fi
      - name: Apply migrations and load the fake seed data
        if: steps.config.outputs.configured == 'true' && inputs.seed == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          if [ -n "$STAGING_POOLER_URL" ]; then
            pnpm supabase db push --db-url "$STAGING_POOLER_URL" --include-seed
          else
            pnpm supabase db push --linked --password "$STAGING_DB_PASSWORD" --include-seed
          fi

  smoke:
    name: Staging smoke test
    needs: migrate
    if: needs.migrate.outputs.configured == 'true' && vars.STAGING_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Wait for the new version and check it
        env:
          EXPECT_COMMIT: ${{ github.sha }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: node scripts/smoke.mjs "$STAGING_URL"
