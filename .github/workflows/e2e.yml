name: E2E

# Journey tests with Playwright against the production build and a local Supabase stack
# (login, mail box, database). Fake data only. See e2e/ and docs/TESTING.md section 5.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start the local Supabase stack (database, login, API, file storage, test mailbox)
        run: pnpm supabase start -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Write .env.local from the stack (local demo keys, nothing secret)
        run: pnpm env:local
      - name: Build the app
        run: pnpm build
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the journeys
        run: pnpm test:e2e
